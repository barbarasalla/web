<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <h2>Formulário HTML</h2>
    <!-- 1 - Primeiro Formulário -->
    <form action="register.php" method="POST">
        <div>
            <label>Nome:</label>
            <input type="text"/>
        </div>

        <!-- 2 - Atributo name e for -->
        <div>
            <label for="age">Idade:</label>
            <input name="age" type="text"/>
        </div>

        <!-- 3 - campo select -->
        <div>
            <label for="job">Selecione a sua profissão:</label>
            <select name="job">
                <option value="programador">Programador(a)</option>
                <option value="taxista">Taxista</option>
                <option value="vendedor">Vendedor(a)</option>
            </select>
        </div>

        <!-- 4 - SELECTED: campo select com option previamente selecionada -->
        <div>
            <label for="contract">Você leu os termos do contrato?</label>
            <select name="contract">
                <option value="yes">Sim</option>
                <option value="not" selected>Não</option>
            </select>
        </div>

        <!-- 5 - campo select com múltiplas opções para seleção -->
        <div>
            <label for="items">Selecione os itens desejados</label>
            <select name="items" multiple>
                <option value="pera">Pera</option>
                <option value="feijao">Feijão</option>
                <option value="maca">Maça</option>
            </select>
        </div>

        <!-- 6 - campo TEXTAREA -->
        <!-- 18 - PLACEHOLDER -->
        <div>
            <label for="comment">Comentário:</label>
            <textarea name="comment" placeholder="Escreva seu comentário"></textarea>
        </div>

        <!-- 7 - fieldset e legend -->
        <div>
            <fieldset>
                <legend>Preencha as suas informações:</legend>
                <label for="name">Nome:</label>
                <input type="text" name="firstName">
                <label for="name">Sobrenome:</label>
                <input type="text" name="lastName">
            </fieldset>
        </div>

        <!-- 8 - Datalist (Permite flexibilidade de pesquisar ou digitar) -->
         <div>
            <label for="flavor">Escolha o sabor:</label>
            <input type="text" name="flavors" list="flavors">

            <datalist id="flavors">
                <option value="Cereja"></option>
                <option value="Manga"></option>
            </datalist>
         </div>

        <!-- 9 - senha -->
        <div>
            <label for="password">Digite a sua senha:</label>
            <input type="password" name="password">
        </div>

        <!-- 10 - radio button (APENAS É POSSÍVEL SELECIONAR UMA OPÇÃO) -->
        <div>
            <label for="car_model">Escolha o modelo do seu carro:</label>
            <div class="radio">
                <input type="radio" value="bmw" name="car_model">
                <label for="bmw">BMW</label>
            </div>
            <div class="radio">
                <input type="radio" value="ferrari" name="car_model">
                <label for="ferrari">Ferrari</label>
            </div>
        </div>

        <!-- 11 - checkbox (Mais de uma opção) -->
        <div>
            <label for="optionals">Opcionais do carro:</label>
            <div class="radio">
                <input type="checkbox" name="optionals[]" value="big_tires" >
                <label for="big_tires">Pneus Grandes</label>
            </div>
            <div class="radio">
                <input type="checkbox" name="optionals[]" value="turbo_engine" >
                <label for="turbo_engine">Motor Turbo</label>
            </div>
        </div>

        <!-- 12 - data -->
        <div>
            <label for="birthday">Digite a data de nascimento:</label>
            <input type="date" name="birthday">
        </div>

        <!-- 13 - arquivos -->
        <div>
            <label for="image">Insira sua imagem:</label>
            <input type="file" name="image">
        </div>

        <!-- 14 - numeros -->
        <div>
            <label for="salary">Insira seu último salário:</label>
            <input type="number" name="salary">
        </div>

        <!-- 15 - email -->
        <div>
            <label for="email">Digite seu email:</label>
            <input type="email" name="email">
        </div>

        <!-- 16 - VALUE: pré-preenche os campos com valores definidos -->
        <div>
            <label for="value">Digite seu email:</label>
            <input type="text" name="value" value="Valor pré-preenchido">
        </div>

        <!-- 17 - DISABLED -->
        <!-- Quando aplicado o disabled valor do campo não é enviado junto com o formulário -->
        <div>
            <label for="disabled">Digite seu email:</label>
            <input type="text" name="value" value="Não precisa preencher" disabled>
        </div>

        <!-- 19 - REQUIRED -->
        <div>
            <label for="required">Digite o ano que você nasceu:</label>
            <input type="number" name="required" required>
        </div>

        <!-- 20 - Limpar dados do formulário -->
        <div>
            <input type="reset" value="Limpar">
        </div>


        <!-- 21 - Envio do Form (type submit) -->
        <div>
            <!-- Campo value define o nome apresentado ao usuário do botão -->
            <input type="submit" value="Enviar"/>
        </div>
    </form>
    
</body>
</html>
